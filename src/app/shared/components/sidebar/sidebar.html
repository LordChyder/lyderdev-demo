<nav class="sidebar" aria-label="Navegación principal">
  <div class="sidebar__brand" [class.sidebar__brand--condensed]="condensed">
    <svg class="sidebar__brand-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M15 31c-5.5 0-10-4.5-10-10s4.5-10 10-10c3 0 5.7 1.3 7.5 3.4C25.1 9.5 28.5 7 33 7c5.4 0 10.1 3.6 11.6 8.5A10 10 0 0 1 51 13c5.5 0 10 4.5 10 10s-4.5 10-10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M18 31v13c0 3.3 2.7 6 6 6h18c3.3 0 6-2.7 6-6V31" fill="white" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M27 38v5m6-5v5m6-5v5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
    </svg>
    @if (!condensed) {
      <div class="sidebar__brand-copy">
        <strong>Lyder<span>Restaurant</span></strong>
        <small>POS Restaurante</small>
      </div>
    }
  </div>

  <mat-nav-list class="sidebar__nav">
    @for (item of visibleNavItems(); track item.path) {
      <a
        mat-list-item
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        [matTooltip]="condensed ? item.label : ''"
        matTooltipPosition="right"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        @if (!condensed) {
          <span matListItemTitle>{{ item.label }}</span>
        }
      </a>
    }
  </mat-nav-list>

</nav>
