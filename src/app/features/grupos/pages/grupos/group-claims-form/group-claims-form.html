<div class="group-claims-form">
  <button type="button" class="group-claims-form__back" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
    Volver a grupos
  </button>

  <h2 class="group-claims-form__title">
    {{ groupName ? 'Permisos — ' + groupName : 'Permisos del grupo' }}
  </h2>

  @if (loading()) {
    <div class="group-claims-form__state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (options().length === 0) {
    <p class="group-claims-form__empty">No hay permisos disponibles.</p>
  } @else {
    <mat-accordion multi class="group-claims-form__accordion">
      @for (node of options(); track node.permissionId) {
        <app-permission-node [node]="node" (toggle)="toggle($event)" />
      }
    </mat-accordion>
  }

  @if (error()) {
    <p class="group-claims-form__error">{{ error() }}</p>
  }

  <div class="group-claims-form__actions">
    <button mat-button type="button" (click)="goBack()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="loading() || saving()"
      (click)="submit()"
    >
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>
