<div class="combo">
  <header class="combo__header">
    <h1>Combo</h1>
    <button
      mat-fab
      extended
      color="primary"
      type="button"
      class="combo__fab"
      (click)="openCreate()"
    >
      <mat-icon>add</mat-icon>
      Nuevo combo
    </button>
  </header>

  @if (loading()) {
    <div class="combo__state">
      <mat-spinner diameter="32" />
    </div>
  } @else if (error()) {
    <div class="combo__state combo__state--error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
    </div>
  } @else if (combos().length === 0) {
    <div class="combo__state">
      <span>No hay combos registrados.</span>
    </div>
  } @else {
    <div class="combo__table-wrapper">
      <table mat-table [dataSource]="combos()" class="combo__table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let combo">{{ combo.name }}</td>
        </ng-container>

        <ng-container matColumnDef="items">
          <th mat-header-cell *matHeaderCellDef>Productos</th>
          <td mat-cell *matCellDef="let combo">{{ combo.items }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let combo">
            <span class="combo__status" [class.combo__status--inactive]="!combo.isActive">
              <mat-icon>{{ combo.isActive ? 'check' : 'remove' }}</mat-icon>
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let combo">
            <button
              mat-icon-button
              type="button"
              class="combo__action combo__action--edit"
              (click)="openEdit(combo)"
              aria-label="Editar combo"
              matTooltip="Editar"
            >
              <mat-icon>edit</mat-icon>
            </button>
            @if (combo.isActive) {
              <button
                mat-icon-button
                type="button"
                class="combo__action combo__action--state"
                (click)="inactivate(combo)"
                aria-label="Inactivar combo"
                matTooltip="Inactivar"
              >
                <mat-icon>block</mat-icon>
              </button>
            } @else {
              <button
                mat-icon-button
                type="button"
                class="combo__action combo__action--state"
                (click)="activate(combo)"
                aria-label="Activar combo"
                matTooltip="Activar"
              >
                <mat-icon>check_circle</mat-icon>
              </button>
            }
            <button
              mat-icon-button
              type="button"
              class="combo__action combo__action--products"
              (click)="viewProducts(combo)"
              aria-label="Ver productos del combo"
              matTooltip="Ver productos"
            >
              <mat-icon>inventory_2</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              class="combo__action combo__action--delete"
              (click)="deleteCombo(combo)"
              aria-label="Eliminar combo"
              matTooltip="Eliminar"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalRows()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPage($event)"
    />
  }
</div>
